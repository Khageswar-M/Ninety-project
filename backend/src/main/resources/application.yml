server:
  port: 8080
  address: 0.0.0.0

spring:

  main:
    lazy-initialization: true

  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  ai:
    openai:
      api-key: ${OPEN_AI_KEY}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ---------- Redis ----------
data:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    timeout: 5000

cache:
  type: redis
  redis:
    time-to-live: 600000 # 10 min default TTL

# ---------- Async / task executor ----------
task:
  execution:
    pool:
      core-size: 4
      max-size: 10
      queue-capacity: 100
    thread-name-prefix: ninety-async-

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXP}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP} # 7 days

  otp:
    expiry-minutes: ${OTP_EXPIRY_MIN}
    length: ${OTP_LENGTH}

  challenge:
    total-days: 90
    grid-rows: 9
    grid-cols: 10

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ninety.backend: DEBUG
